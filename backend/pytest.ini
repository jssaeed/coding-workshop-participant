# Shared pytest settings for every backend test suite.
#
# Each service is its own Lambda with its own top-level packages (controllers,
# models, views, lib), so the suites must run one service at a time, from that
# service's folder:  cd backend/users && python -m pytest tests
# bin/test-backend.sh does that for every service.
[pytest]
addopts = -ra --strict-markers
markers =
    integration: talks to the real PostgreSQL test database (skipped when it is not reachable)
