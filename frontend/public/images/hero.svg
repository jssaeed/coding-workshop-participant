<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" role="img" aria-label="Line drawing of an office building elevation">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e9f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="520" height="340" fill="#f8fafc"/>
  <rect width="520" height="340" fill="url(#grid)"/>
  <g fill="none" stroke="#334e68" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground line -->
    <path d="M 40 300 H 480"/>
    <!-- main tower -->
    <rect x="200" y="60" width="150" height="240"/>
    <path d="M 200 100 H 350 M 200 140 H 350 M 200 180 H 350 M 200 220 H 350 M 200 260 H 350"/>
    <!-- tower windows -->
    <g stroke-width="1">
      <path d="M 215 72 h 20 v 16 h -20 z M 250 72 h 20 v 16 h -20 z M 285 72 h 20 v 16 h -20 z M 320 72 h 20 v 16 h -20 z"/>
      <path d="M 215 112 h 20 v 16 h -20 z M 250 112 h 20 v 16 h -20 z M 285 112 h 20 v 16 h -20 z M 320 112 h 20 v 16 h -20 z"/>
      <path d="M 215 152 h 20 v 16 h -20 z M 250 152 h 20 v 16 h -20 z M 285 152 h 20 v 16 h -20 z M 320 152 h 20 v 16 h -20 z"/>
      <path d="M 215 192 h 20 v 16 h -20 z M 250 192 h 20 v 16 h -20 z M 285 192 h 20 v 16 h -20 z M 320 192 h 20 v 16 h -20 z"/>
      <path d="M 215 232 h 20 v 16 h -20 z M 250 232 h 20 v 16 h -20 z M 285 232 h 20 v 16 h -20 z M 320 232 h 20 v 16 h -20 z"/>
    </g>
    <!-- entrance -->
    <path d="M 260 300 V 272 H 290 V 300 M 275 272 V 300"/>
    <!-- roof detail -->
    <path d="M 200 60 L 208 48 H 342 L 350 60 M 265 48 V 34 H 285 V 48"/>
    <!-- left wing -->
    <rect x="90" y="160" width="110" height="140"/>
    <path d="M 90 200 H 200 M 90 240 H 200 M 90 280 H 200"/>
    <g stroke-width="1">
      <path d="M 104 172 h 16 v 14 h -16 z M 132 172 h 16 v 14 h -16 z M 160 172 h 16 v 14 h -16 z"/>
      <path d="M 104 212 h 16 v 14 h -16 z M 132 212 h 16 v 14 h -16 z M 160 212 h 16 v 14 h -16 z"/>
      <path d="M 104 252 h 16 v 14 h -16 z M 132 252 h 16 v 14 h -16 z M 160 252 h 16 v 14 h -16 z"/>
    </g>
    <!-- right wing -->
    <rect x="350" y="120" width="90" height="180"/>
    <path d="M 350 160 H 440 M 350 200 H 440 M 350 240 H 440 M 350 280 H 440"/>
    <g stroke-width="1">
      <path d="M 364 132 h 14 v 12 h -14 z M 388 132 h 14 v 12 h -14 z M 412 132 h 14 v 12 h -14 z"/>
      <path d="M 364 172 h 14 v 12 h -14 z M 388 172 h 14 v 12 h -14 z M 412 172 h 14 v 12 h -14 z"/>
      <path d="M 364 212 h 14 v 12 h -14 z M 388 212 h 14 v 12 h -14 z M 412 212 h 14 v 12 h -14 z"/>
      <path d="M 364 252 h 14 v 12 h -14 z M 388 252 h 14 v 12 h -14 z M 412 252 h 14 v 12 h -14 z"/>
    </g>
  </g>
  <!-- dimension / annotation lines -->
  <g fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3">
    <path d="M 460 60 V 300 M 455 60 H 465 M 455 300 H 465"/>
    <path d="M 90 318 H 440 M 90 313 V 323 M 440 313 V 323"/>
  </g>
  <g fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="10">
    <text x="468" y="184">12 fl.</text>
    <text x="250" y="334">350 m</text>
    <text x="42" y="56">ACME HQ · ELEVATION</text>
  </g>
  <!-- highlighted floor marker -->
  <rect x="200" y="140" width="150" height="40" fill="#1e3a5f" fill-opacity="0.08" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="204" cy="160" r="3" fill="#1e3a5f"/>
  <text x="212" y="164" fill="#1e3a5f" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Ticket #12 · Floor 3</text>
</svg>
